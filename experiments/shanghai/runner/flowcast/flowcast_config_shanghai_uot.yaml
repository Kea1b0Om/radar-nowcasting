# Shanghai + UOT -- the treatment arm. Identical to the plain config except
# run_string, resume path and uot_params (see plain config for data/protocol
# notes).
#
# Data: DiffCast's official shanghai.h5 (what SDIR/DuoCast also train on),
# converted by datasets/shanghai/shanghai_diffcast_to_h5.py: 128x128, 25
# frames, dBZ*255/90. Split train 1381 / val 153 (last 10% of official train,
# event order) / test 526 (official test untouched). Protocol 5 -> 20,
# pixel_scale 90, thresholds [20, 30, 35, 40] = the DiffCast/SDIR table
# protocol, so numbers land on their published scale.
#
# Twin rules (same as SEVIR-LR): run with the SAME world_size / micro batch /
# accum as the UOT arm, sequentially on the same 3 cards. seed 42 is
# hard-coded in dist_train_flowcast.py, so equal shapes => identical noise
# stream and data order.

stdit:
  hidden_size: 1024
  depth: 12
  num_heads: 8
  patch_size: [1, 2, 2]
  mlp_ratio: 4.0
  drop_path: 0.0
  qk_norm: true

rflow_params:
  num_train_timesteps: 1000

sampling_params:
  euler_steps: 10

training_params:
  # 3-GPU DDP: micro 2 x accum 1 x world 3 = effective batch 6. micro 2 is
  # the UOT arm's memory ceiling (40 grad-retaining pixel decodes); both arms
  # must match it exactly or the pairing breaks.
  micro_batch_size: 2
  grad_accumulation_steps: 1
  # 500 epochs to match CRFT's own max_epoches=501 on this dataset. NOT the
  # 200 used on CIKM: an epoch here is only 230 updates (1381 events / batch
  # 6) versus CIKM's 889, so 200 epochs would be ~46k updates against
  # DiffCast's 200k-step and CRFT's 501-epoch budgets -- i.e. our own method
  # would be the only undertrained entry in the comparison. 500 x 230 = 115k
  # updates; early_stopping_patience 50 (~4.4 h) guards the overfitting side.
  num_epochs: 500
  num_workers: 12
  early_stopping_patience: 50
  early_stopping_metric: "partial_csi_m"
  gradient_clip_val: 1.0
  fp16: true
  # 230 iters/epoch on 3 cards -- save twice an epoch, not every other epoch.
  save_latest_every_batches: 100

optimizer_params:
  # 3e-4 to match the Shanghai baselines' own setting: CRFT uses 3e-4 and
  # SDIR reports "AdamW, initial learning rate of 0.0003". FlowCast's usual
  # 5e-4 (used on CIKM/SEVIR) was left behind deliberately so the comparison
  # cannot be attributed to a more aggressive schedule on our side.
  learning_rate: 0.0003
  optimizer_type: "adamw"
  weight_decay: 0.0001

scheduler_params:
  scheduler_type: "cosine"
  lr_plateau_factor: 0.2
  lr_plateau_patience: 6
  lr_cosine_warmup_iter_percentage: 0.01
  lr_cosine_min_warmup_lr_ratio: 0.1
  lr_cosine_min_lr_ratio: 0.01

data_params:
  dataset_name: "shanghai"
  data_key: "vil"
  raw_seq_len: 25
  input_length: 5
  output_length: 20
  lag_time: 5
  lead_time: 20
  time_spacing: 1
  # 25 == lag + lead, exactly one window per event.
  stride: 25

evaluation_params:
  pixel_scale: 90.0
  thresholds: [20, 30, 35, 40]

run_params:
  debug_mode: false
  enable_wandb: true   # server reaches api.wandb.ai; creds in ~/.netrc (entity laokeaia)
  run_string: "shanghai_uot"
  preload_model: null
  resume_latest_path: "artifacts/shanghai/flowcast/shanghai_uot_latest.pt"

partial_evaluation_params:
  partial_evaluation: true
  partial_evaluation_interval: 1
  # 77, not 40: the partial loader does NOT use test_params.micro_batch_size,
  # it uses `BATCH_SIZE // 4 if BATCH_SIZE > 4 else BATCH_SIZE` (
  # dist_train_flowcast.py:1066), which for our micro batch of 2 is 2. So 40
  # batches covered only 40x2 = 80 of the 153 validation events -- always the
  # same first 80, since shuffle=False -- i.e. 52%, on a val split that is
  # itself the chronological tail of train and so seasonally skewed.
  # ceil(153/2) = 77 covers all of it. (An earlier comment here claimed
  # "40 x 6 caps out"; that was wrong -- 6 is the TEST batch size.)
  partial_evaluation_batches: 77
  cartopy_features: false

autoencoder_params:
  # Canonical path; the trained Shanghai AE artifact gets copied here (the
  # trainer writes to a timestamped artifacts/ dir). Trained 2026-07-28 on
  # the Shanghai train split only -- no val/test leakage.
  autoencoder_checkpoint: "${DATA_ROOT}/saved_models/shanghai/autoencoder/models/early_stopping_model.pt"
  normalized_autoencoder: true
  latent_channels: 4
  norm_num_groups: 32
  layers_per_block: 2
  act_fn: "silu"
  block_out_channels: [128, 256, 512, 512]
  down_block_types:
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"
  up_block_types:
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"

ema_model_saving_params:
  ema_model_saving: true
  ema_model_saving_decay: 0.999

test_params:
  micro_batch_size: 6
  num_workers: 12
  probabilistic_samples: 1
  batch_size_autoencoder: 12
  euler_steps: 10
  cartopy_features: false

uot_params:
  enabled: true
  # dBZ radar physics: same mass transform family as CIKM v4 (zr_dbz Z-R
  # conversion), NOT the SEVIR "vil" block -- Shanghai pixels are dBZ*255/90
  # exactly like CIKM's, pixel_scale 90, floor 0.5 dBZ.
  mass_transform: "zr_dbz"
  mass_low_threshold: 0.5
  threshold_mode: "soft"
  threshold_softness: 1.0
  mass_gamma: 1.0
  mass_scale: 10.0
  mass_zero_point: 0.0
  # Single-knob policy (like SEVIR-LR): M_ref at identity, `weight` calibrated
  # by probe. CALIBRATED 2026-07-28: the probe (warmup 0, weight 5e-4)
  # measured uot_ratio mean 1.011 +- 0.70 (n=60, median 0.797). The UOT term
  # is linear in weight, so 5e-4 * 0.10 / 1.011 = 5e-5 puts it at ~10% of the
  # base loss, mid-band. (SEVIR-LR's identical procedure predicted 0.10 and
  # measured 0.098, so the linear scaling holds in practice.)
  value_scale_ref: 1.0
  weight: 0.00005
  t_power: 1.0
  normalize_by_mass: false
  dry_frame_mass: 0.001
  # ~2 epochs: global_step advances by per-rank micro_batch, one epoch on
  # 3 GPUs = 1381 / 3 ~= 460 steps.
  warmup_steps: 920
  blur: 4.0
  reach: 16.0
  # 128 / 4 = 32; sum_pool2d needs the factor to divide the side exactly.
  downsample: 4
  n_iters: 100
  self_iters: 50
